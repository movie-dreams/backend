name: CI api cine

on:
  push:
    branches:
      - main

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/api-cine:${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar-node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: instalar-dependencias
        run: npm ci

      - name: ejecutar-pruebas
        run: npm run test

      - name: verificar-build
        run: npm run build

  docker:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker-build
        run: docker build -t ${{ env.IMAGEN }} .

      - name: docker-push
        run: |
          docker push ${{ env.IMAGEN }}
          echo "Imagen backend subida a Docker Hub: ${{ env.IMAGEN }}"
